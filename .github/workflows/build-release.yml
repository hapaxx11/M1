name: Build and Release

# Triggers:
#   1. Every push (merge) to main → automatic release with auto-incremented version.
#      Only pushes that change firmware inputs (see `paths` below) release;
#      docs, databases, IDE files, CI workflows and host tests are skipped.
#   2. Manual dispatch from the Actions tab → optional tag/name overrides.
# Releases are NOT marked pre-release by default — use the 'prerelease' input to override.
on:
  push:
    branches: [main]
    # Firmware inputs only — keep identical in build-release.yml, ci.yml and
    # prepare-changelog.yml.  Anything else cannot change the release binary.
    paths:
      - '**.c'
      - '**.h'
      - '**.inc'                       # #included sources (e.g. Sub_Ghz/*.inc)
      - '**.s'                         # startup assembly
      - '**.ld'                        # linker scripts
      - '**/CMakeLists.txt'
      - 'cmake/**'
      - 'scripts/gen_*_builtin.py'     # build-time generated key/table sources
      - 'tools/append_crc32.py'        # injects CRC + Hapax metadata into the image
      - '!tests/**'                    # host tests — covered by tests.yml
      - '!documentation/**'            # reference-only sources, not compiled
  workflow_dispatch:
    inputs:
      tag:
        description: >
          Release tag (e.g. v0.9.0.5).
          Leave blank to auto-increment from the latest published release.
        required: false
        default: ''
      release_name:
        description: 'Human-readable release title (optional)'
        required: false
        default: ''
      prerelease:
        description: 'Mark this release as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write        # needed to create the release and upload assets

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-24.04

    outputs:
      tag:              ${{ steps.meta.outputs.tag }}
      release_name:     ${{ steps.meta.outputs.release_name }}
      project_name:     ${{ steps.meta.outputs.project_name }}
      release_file_base: ${{ steps.meta.outputs.release_file_base }}
      is_prerelease:    ${{ steps.meta.outputs.is_prerelease }}
      compare_line:     ${{ steps.meta.outputs.compare_line }}
      changelog_notes:  ${{ steps.changelog.outputs.notes }}

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout (with submodules)
      # ------------------------------------------------------------------ #
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # ------------------------------------------------------------------ #
      # 2. Auto-increment version — patch source files before building
      # ------------------------------------------------------------------ #
      # Queries the latest published release whose tag matches v{MAJOR}.{MINOR}.{BUILD}.*
      # and sets RC = (latest RC) + 1, so every CI run produces the next sequential
      # release automatically.  If a manual tag is supplied, its RC is used instead.
      # Only m1_fw_update_bl.h (FW_VERSION_RC, M1_HAPAX_REVISION) is patched.
      # CMakeLists.txt is NOT patched — it derives CMAKE_PROJECT_NAME automatically
      # from those same #define values at configure time.
      - name: Compute next version and patch source
        id: patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAJOR=$(grep -m1 '#define[[:space:]]FW_VERSION_MAJOR' m1_csrc/m1_fw_update_bl.h \
                  | awk '{print $3}' | grep -Eo '^[0-9]+')
          MINOR=$(grep -m1 '#define[[:space:]]FW_VERSION_MINOR' m1_csrc/m1_fw_update_bl.h \
                  | awk '{print $3}' | grep -Eo '^[0-9]+')
          BUILD=$(grep -m1 '#define[[:space:]]FW_VERSION_BUILD' m1_csrc/m1_fw_update_bl.h \
                  | awk '{print $3}' | grep -Eo '^[0-9]+')

          if [ -n "${{ inputs.tag }}" ]; then
            # Use RC from the manually-supplied tag (e.g. v0.9.0.5 → 5)
            NEW_RC=$(echo "${{ inputs.tag }}" | grep -Eo '[0-9]+$')
            echo "Using manual tag RC: ${NEW_RC}"
          else
            # Auto-increment: find the highest RC already released for this prefix
            PREFIX="v${MAJOR}.${MINOR}.${BUILD}."
            LATEST_RC=$(gh release list \
                --repo "$GITHUB_REPOSITORY" \
                --limit 50 \
                --json tagName \
              | python3 -c "
          import json, sys
          prefix = '${PREFIX}'
          tags = [t['tagName'] for t in json.load(sys.stdin)]
          nums = []
          for t in tags:
              if t.startswith(prefix):
                  tail = t[len(prefix):]
                  if tail.isdigit():
                      nums.append(int(tail))
          print(max(nums) if nums else 0)
          " 2>/dev/null || echo "0")
            NEW_RC=$((LATEST_RC + 1))
            echo "Latest released RC: ${LATEST_RC} → next RC: ${NEW_RC}"

          fi

          echo "new_rc=${NEW_RC}" >> "$GITHUB_OUTPUT"

          # Previous release tag (any version), used for the "Full Changelog"
          # compare link in the release notes. Empty on the very first release.
          PREV_TAG=$(gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --exclude-drafts \
              --limit 1 \
              --json tagName \
              --jq '.[0].tagName // empty' 2>/dev/null || echo "")
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

          # Patch FW_VERSION_RC in the header
          sed -i "s/^\(#define[[:space:]]FW_VERSION_RC[[:space:]]*\)[0-9]*/\1${NEW_RC}/" \
              m1_csrc/m1_fw_update_bl.h
          # Patch M1_HAPAX_REVISION in the header
          sed -i "s/^\(#define[[:space:]]M1_HAPAX_REVISION[[:space:]]*\)[0-9]*/\1${NEW_RC}/" \
              m1_csrc/m1_fw_update_bl.h
          echo "--- Patched values ---"
          grep -E 'FW_VERSION_RC|M1_HAPAX_REVISION' m1_csrc/m1_fw_update_bl.h

      # ------------------------------------------------------------------ #
      # 2a. Build "What's Changed" release notes from CHANGELOG.md
      #
      # Fragments are assembled and the version is stamped into CHANGELOG.md
      # in the PR branch before merge (prepare-changelog.yml), so the notes
      # are the changelog sections newer than the previous release, plus any
      # fragments that reached main without being assembled (see
      # .changelog/README.md). Rendering them here — instead of relying on
      # GitHub's PR-label-based auto-notes — avoids the release page
      # collapsing everything into a single "Other Changes" bullet when PRs
      # aren't labelled.
      # ------------------------------------------------------------------ #
      - name: Build "What's Changed" notes from CHANGELOG.md
        id: changelog
        env:
          GH_TOKEN: ${{ github.token }}
          PREV_TAG: ${{ steps.patch.outputs.prev_tag }}
        run: |
          set -euo pipefail
          # CHANGELOG.md as published in the previous release, so sections that
          # only *predicted* an already-used version are still recognised as
          # pending instead of being silently dropped from the notes.
          RELEASED_CHANGELOG=""
          if [ -n "${PREV_TAG}" ] && gh api \
                "repos/${GITHUB_REPOSITORY}/contents/CHANGELOG.md?ref=${PREV_TAG}" \
                -H "Accept: application/vnd.github.raw" \
                > "${RUNNER_TEMP}/released_changelog.md"; then
            RELEASED_CHANGELOG="${RUNNER_TEMP}/released_changelog.md"
          fi
          RAW="$(python3 scripts/stamp_changelog.py notes --released "${PREV_TAG}" \
                   --released-changelog "${RELEASED_CHANGELOG}")"
          if [ -z "$(printf '%s' "${RAW}" | tr -d '[:space:]')" ]; then
            RAW="_No changelog fragments were recorded for this release._"
          fi
          printf 'notes<<CHANGELOG_NOTES_EOF\n%s\nCHANGELOG_NOTES_EOF\n' "${RAW}" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------ #
      # 3. Read project metadata from source tree (after patching)
      # ------------------------------------------------------------------ #
      - name: Read build metadata
        id: meta
        run: |
          # Parse version from the header — single source of truth now that
          # CMAKE_PROJECT_NAME and M1_HAPAX_REVISION are derived at configure time.
          MAJOR=$(grep -m1 '#define[[:space:]]FW_VERSION_MAJOR' m1_csrc/m1_fw_update_bl.h \
                  | awk '{print $3}' | grep -Eo '^[0-9]+')
          MINOR=$(grep -m1 '#define[[:space:]]FW_VERSION_MINOR' m1_csrc/m1_fw_update_bl.h \
                  | awk '{print $3}' | grep -Eo '^[0-9]+')
          BUILD=$(grep -m1 '#define[[:space:]]FW_VERSION_BUILD' m1_csrc/m1_fw_update_bl.h \
                  | awk '{print $3}' | grep -Eo '^[0-9]+')
          RC=$(grep -m1 '#define[[:space:]]FW_VERSION_RC' m1_csrc/m1_fw_update_bl.h \
               | awk '{print $3}' | grep -Eo '^[0-9]+')
          HAPAX_REV=${RC}

          PROJECT="M1_Hapax_v${MAJOR}.${MINOR}.${BUILD}.${RC}"
          echo "project_name=${PROJECT}" >> "$GITHUB_OUTPUT"
          echo "hapax_rev=${HAPAX_REV}" >> "$GITHUB_OUTPUT"

          # Decide the release tag
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v${MAJOR}.${MINOR}.${BUILD}.${RC}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # Decide the release title
          if [ -n "${{ inputs.release_name }}" ]; then
            RNAME="${{ inputs.release_name }}"
          else
            RNAME="M1 Hapax ${TAG}"
          fi
          echo "release_name=${RNAME}" >> "$GITHUB_OUTPUT"

          # Release file base name = project name (version is embedded in it, SiN360-style).
          # The wCRC image is ${PROJECT}_wCRC.bin, ELF/BIN/HEX are ${PROJECT}.{ext}.
          RFILE="${PROJECT}"
          echo "release_file_base=${RFILE}" >> "$GITHUB_OUTPUT"

          # Full-changelog compare link (empty on the very first release).
          PREV_TAG="${{ steps.patch.outputs.prev_tag }}"
          if [ -n "${PREV_TAG}" ]; then
            COMPARE_LINE="**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
          else
            COMPARE_LINE=""
          fi
          {
            echo "compare_line<<COMPARE_LINE_EOF"
            echo "${COMPARE_LINE}"
            echo "COMPARE_LINE_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "--- Build metadata ---"
          echo "  Project:      ${PROJECT}"
          echo "  Hapax rev:    ${HAPAX_REV}"
          echo "  Base version: ${MAJOR}.${MINOR}.${BUILD}.${RC}"
          echo "  Tag:          ${TAG}"
          echo "  Release file: ${RFILE}_wCRC.bin"

          # Pre-release: only when explicitly requested via the manual dispatch input.
          MANUAL_PRERELEASE="${{ inputs.prerelease }}"
          if [ "${MANUAL_PRERELEASE}" = "true" ]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "  Pre-release:  ${IS_PRERELEASE}"

      # ------------------------------------------------------------------ #
      # 4. Install toolchain and build tools
      # ------------------------------------------------------------------ #
      - name: Install ARM toolchain and build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            cmake \
            ninja-build \
            python3 \
            zip

      # ------------------------------------------------------------------ #
      # 4a. Embed KeeLoq manufacturer keys from private vault (optional)
      #
      # Set the KEELOQ_KEY_VAULT repository secret to the full contents of
      # a KeeLoq key file (RocketGod format or compact HEX:TYPE:NAME).
      # When the secret is present, the generator script overwrites
      # Sub_Ghz/subghz_keeloq_mfkeys_builtin.c with the real keys before
      # the firmware is compiled — the keys are baked into the binary and
      # never appear as a file on the SD card (Flipper-compatible approach).
      #
      # When the secret is absent, the committed NULL stub is used and
      # keeloq_mfkeys_load() falls back to the SD card keystore at runtime.
      # ------------------------------------------------------------------ #
      - name: Embed KeeLoq manufacturer keys
        env:
          KEELOQ_KEY_VAULT: ${{ secrets.KEELOQ_KEY_VAULT }}
        run: |
          if [ -n "${KEELOQ_KEY_VAULT}" ]; then
            printf '%s' "${KEELOQ_KEY_VAULT}" > /tmp/keeloq_vault.txt
            python3 scripts/gen_keeloq_mfkeys_builtin.py \
              /tmp/keeloq_vault.txt \
              Sub_Ghz/subghz_keeloq_mfkeys_builtin.c
            rm -f /tmp/keeloq_vault.txt
            echo "KeeLoq manufacturer keys embedded from vault."
          else
            echo "KEELOQ_KEY_VAULT secret not set — using NULL stub (SD card fallback)."
          fi

      # ------------------------------------------------------------------ #
      # 4a. Embed optional ProtoPirate Kia V6 and VAG keys. The generator
      #     validates plaintext Flipper entries / RAW data and decrypted VAG
      #     hexdumps; encrypted files are skipped until replaced with plaintext.
      #     Key data is embedded in firmware.
      # ------------------------------------------------------------------ #
      - name: Embed ProtoPirate Kia and VAG keys
        env:
          KIA_V6_KEYSTORE_RAW: ${{ secrets.KIA_V6_KEYSTORE_RAW }}
          VAG_AUT64_KEYSTORE_RAW: ${{ secrets.VAG_AUT64_KEYSTORE_RAW }}
        run: |
          umask 077
          secret_dir="$(mktemp -d)"
          trap 'rm -rf "$secret_dir"' EXIT
          args=()
          if [ -n "${KIA_V6_KEYSTORE_RAW}" ]; then
            printf '%s' "${KIA_V6_KEYSTORE_RAW}" > "${secret_dir}/kia.txt"
            args+=(--kia-keystore "${secret_dir}/kia.txt")
          fi
          if [ -n "${VAG_AUT64_KEYSTORE_RAW}" ]; then
            printf '%s' "${VAG_AUT64_KEYSTORE_RAW}" > "${secret_dir}/vag.txt"
            args+=(--vag-keystore "${secret_dir}/vag.txt")
          fi
          python3 scripts/gen_protopirate_keys_builtin.py \
            "${args[@]}" \
            Sub_Ghz/subghz_protopirate_keys_builtin.c
          echo "ProtoPirate key data prepared for firmware build."

      # ------------------------------------------------------------------ #
      # 4b. Embed Nice FloR-S rainbow table (optional — same pattern as
      #     KeeLoq).  The NICE_FLOR_S_RAINBOW_TABLE secret holds 64 hex
      #     chars (32 bytes).  When absent, the NULL stub is used and
      #     counter/serial fields show "table?" placeholders.
      # ------------------------------------------------------------------ #
      - name: Embed Nice FloR-S rainbow table
        env:
          NICE_FLOR_S_RAINBOW_TABLE: ${{ secrets.NICE_FLOR_S_RAINBOW_TABLE }}
        run: |
          if [ -n "${NICE_FLOR_S_RAINBOW_TABLE}" ]; then
            python3 scripts/gen_nice_flor_s_table_builtin.py \
              --hex "${NICE_FLOR_S_RAINBOW_TABLE}" \
              Sub_Ghz/subghz_nice_flor_s_table_builtin.c
            echo "Nice FloR-S rainbow table embedded from secret."
          else
            echo "NICE_FLOR_S_RAINBOW_TABLE secret not set — using NULL stub."
          fi

      # ------------------------------------------------------------------ #
      # 4c. Embed Alutech AT-4N rainbow table (optional — same pattern as
      #     Nice FloR-S).  The ALUTECH_AT_4N_RAINBOW_TABLE secret holds
      #     64 hex chars (32 bytes = 8 × uint32_t TEA round constants).
      #     When absent, the NULL stub is used and counter/serial fields
      #     show "table?" placeholders.
      # ------------------------------------------------------------------ #
      - name: Embed Alutech AT-4N rainbow table
        env:
          ALUTECH_AT_4N_RAINBOW_TABLE: ${{ secrets.ALUTECH_AT_4N_RAINBOW_TABLE }}
        run: |
          if [ -n "${ALUTECH_AT_4N_RAINBOW_TABLE}" ]; then
            python3 scripts/gen_alutech_at_4n_table_builtin.py \
              --hex "${ALUTECH_AT_4N_RAINBOW_TABLE}" \
              Sub_Ghz/subghz_alutech_at_4n_table_builtin.c
            echo "Alutech AT-4N rainbow table embedded from secret."
          else
            echo "ALUTECH_AT_4N_RAINBOW_TABLE secret not set — using NULL stub."
          fi

      # ------------------------------------------------------------------ #
      # 5. Configure CMake
      # ------------------------------------------------------------------ #
      - name: Configure CMake
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # ------------------------------------------------------------------ #
      # 6. Build (CRC injection is a CMake POST_BUILD step)
      # ------------------------------------------------------------------ #
      - name: Build firmware
        run: |
          cmake --build build --parallel $(nproc) 2>&1 | tee build-firmware.log

      # ------------------------------------------------------------------ #
      # 6b. Check RAM budget (early warning, non-blocking)
      # ------------------------------------------------------------------ #
      # See tools/check_ram_budget.sh and the "Static RAM Budget" section of
      # .github/skills/memory-heap/SKILL.md.
      - name: Check RAM budget
        run: |
          bash tools/check_ram_budget.sh build-firmware.log

      # ------------------------------------------------------------------ #
      # 7. Verify artifacts and print memory usage
      # ------------------------------------------------------------------ #
      - name: Verify artifacts
        id: verify
        run: |
          PROJECT="${{ steps.meta.outputs.project_name }}"

          ELF="build/${PROJECT}.elf"
          BIN="build/${PROJECT}.bin"
          HEX="build/${PROJECT}.hex"
          WCRC="build/${{ steps.meta.outputs.release_file_base }}_wCRC.bin"

          for f in "$ELF" "$BIN" "$HEX" "$WCRC"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: expected artifact missing: $f"
              exit 1
            fi
            echo "OK  $(du -h "$f" | cut -f1)   $f"
          done

          # Confirm it is valid ARM firmware.
          # STM32H573 is Cortex-M33 (ARMv8-M); the pattern also matches ARMv7-M
          # as a safety net if the ELF is somehow from a different build variant.
          ARCH=$(arm-none-eabi-objdump -f "$ELF" | grep architecture | head -1)
          echo "Architecture: ${ARCH}"
          if ! echo "$ARCH" | grep -qE "armv8-m|armv7-m"; then
            echo "ERROR: unexpected architecture"
            exit 1
          fi

          arm-none-eabi-size "$ELF"

      # ------------------------------------------------------------------ #
      # 8. Upload artifacts for the release job
      # ------------------------------------------------------------------ #
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ steps.meta.outputs.tag }}
          path: |
            build/${{ steps.meta.outputs.project_name }}.elf
            build/${{ steps.meta.outputs.project_name }}.hex
            build/${{ steps.meta.outputs.project_name }}.bin
            build/${{ steps.meta.outputs.release_file_base }}_wCRC.bin
          if-no-files-found: error
          retention-days: 90

  # ====================================================================== #
  # Publish GitHub Release
  # ====================================================================== #
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v8
        with:
          name: firmware-${{ needs.build.outputs.tag }}
          path: artifacts/

      - name: List release assets
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name:   ${{ needs.build.outputs.tag }}
          name:       ${{ needs.build.outputs.release_name }}
          prerelease: ${{ needs.build.outputs.is_prerelease }}
          # Notes are built from the assembled changelog fragments below
          # instead of GitHub's PR-label-based auto-generation, which
          # otherwise collapses everything into a single "Other Changes"
          # bullet when PRs aren't labelled.
          generate_release_notes: false
          files: |
            artifacts/${{ needs.build.outputs.project_name }}.elf
            artifacts/${{ needs.build.outputs.project_name }}.hex
            artifacts/${{ needs.build.outputs.project_name }}.bin
            artifacts/${{ needs.build.outputs.release_file_base }}_wCRC.bin
          body: |
            ## M1 Hapax ${{ needs.build.outputs.tag }}

            ## What's Changed

            ${{ needs.build.outputs.changelog_notes }}

            | File | Description |
            |------|-------------|
            | `${{ needs.build.outputs.release_file_base }}_wCRC.bin` | **SD-card / OTA update image** (CRC + Hapax metadata injected) |
            | `${{ needs.build.outputs.project_name }}.bin`         | Raw binary (no CRC — for direct flashing / reference) |
            | `${{ needs.build.outputs.project_name }}.hex`         | Intel HEX (ST-Link / OpenOCD) |
            | `${{ needs.build.outputs.project_name }}.elf`         | ELF with debug symbols |

            > **Flash via SD card:** copy `*_wCRC.bin` to the root of the SD card and use the M1 firmware update menu.

            ${{ needs.build.outputs.compare_line }}

  # ====================================================================== #
  # Apply release retention policy
  # ====================================================================== #
  retention:
    name: Apply release retention policy
    needs: [build, release]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run retention policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_retention.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag  "${{ needs.build.outputs.tag }}"
