name: CI Build Check

# Runs on every PR targeting main (not on direct pushes — Build and Release
# handles those).  Only PRs that change firmware inputs run it (same `paths`
# allow-list as build-release.yml).  GitHub branch-protection rules can
# require this job ("build") to pass before a PR is mergeable.
on:
  pull_request:
    branches: [main]
    # Firmware inputs only — keep identical in build-release.yml, ci.yml and
    # prepare-changelog.yml.  Anything else cannot change the release binary.
    paths:
      - '**.c'
      - '**.h'
      - '**.inc'                       # #included sources (e.g. Sub_Ghz/*.inc)
      - '**.s'                         # startup assembly
      - '**.ld'                        # linker scripts
      - '**/CMakeLists.txt'
      - 'cmake/**'
      - 'scripts/gen_*_builtin.py'     # build-time generated key/table sources
      - 'tools/append_crc32.py'        # injects CRC + Hapax metadata into the image
      - '!tests/**'                    # host tests — covered by tests.yml
      - '!documentation/**'            # reference-only sources, not compiled

permissions:
  contents: read

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout (with submodules)
      # ------------------------------------------------------------------ #
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # ------------------------------------------------------------------ #
      # 2. Install toolchain and build tools
      # ------------------------------------------------------------------ #
      - name: Install ARM toolchain and build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            cmake \
            ninja-build \
            python3

      # ------------------------------------------------------------------ #
      # 3. Configure CMake
      # ------------------------------------------------------------------ #
      - name: Configure CMake
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # ------------------------------------------------------------------ #
      # 4. Build firmware
      # ------------------------------------------------------------------ #
      - name: Build firmware
        run: |
          cmake --build build --parallel $(nproc) 2>&1 | tee build-firmware.log

      # ------------------------------------------------------------------ #
      # 5. Check RAM budget (early warning, non-blocking)
      # ------------------------------------------------------------------ #
      # See tools/check_ram_budget.sh and the "Static RAM Budget" section of
      # .github/skills/memory-heap/SKILL.md: a hard RAM-overflow link failure
      # (like PR #737 / CI job 100054096523) is the *last* moment to notice a
      # RAM problem. This step re-parses the linker's own memory-usage
      # summary and raises a visible (but non-blocking) warning annotation
      # whenever headroom is critically low, so a PR that eats into the last
      # few KB gets flagged immediately rather than only once some later PR
      # finally tips it over.
      - name: Check RAM budget
        run: |
          bash tools/check_ram_budget.sh build-firmware.log

      # ------------------------------------------------------------------ #
      # 6. Verify artifacts and print memory usage
      # ------------------------------------------------------------------ #
      - name: Verify build artifacts
        run: |
          # Derive project name from the header (same logic as CMakeLists.txt)
          MAJOR=$(grep -m1 '#define[[:space:]]FW_VERSION_MAJOR' m1_csrc/m1_fw_update_bl.h \
                  | awk '{print $3}' | grep -Eo '^[0-9]+')
          MINOR=$(grep -m1 '#define[[:space:]]FW_VERSION_MINOR' m1_csrc/m1_fw_update_bl.h \
                  | awk '{print $3}' | grep -Eo '^[0-9]+')
          BUILD=$(grep -m1 '#define[[:space:]]FW_VERSION_BUILD' m1_csrc/m1_fw_update_bl.h \
                  | awk '{print $3}' | grep -Eo '^[0-9]+')
          RC=$(grep -m1 '#define[[:space:]]FW_VERSION_RC' m1_csrc/m1_fw_update_bl.h \
               | awk '{print $3}' | grep -Eo '^[0-9]+')

          PROJECT="M1_Hapax_v${MAJOR}.${MINOR}.${BUILD}.${RC}"

          ELF="build/${PROJECT}.elf"
          BIN="build/${PROJECT}.bin"
          HEX="build/${PROJECT}.hex"
          MESHTASTIC_APP="build/apps/meshtastic/m1-meshtastic.m1app"

          for f in "$ELF" "$BIN" "$HEX" "$MESHTASTIC_APP"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: expected artifact missing: $f"
              exit 1
            fi
            echo "OK  $(du -h "$f" | cut -f1)   $f"
          done

          # Confirm it is valid ARM firmware
          ARCH=$(arm-none-eabi-objdump -f "$ELF" | grep architecture | head -1)
          echo "Architecture: ${ARCH}"
          if ! echo "$ARCH" | grep -qE "armv8-m|armv7-m"; then
            echo "ERROR: unexpected architecture"
            exit 1
          fi

          arm-none-eabi-size "$ELF"
